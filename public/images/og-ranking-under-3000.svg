<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="#1e40af" opacity="0.15"/>
  <circle cx="150" cy="530" r="150" fill="#1d4ed8" opacity="0.12"/>
  <circle cx="600" cy="600" r="120" fill="#3b82f6" opacity="0.08"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Badge -->
  <rect x="60" y="55" width="180" height="44" rx="22" fill="url(#accent)"/>
  <text x="150" y="83" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">2026年版</text>

  <!-- Main title -->
  <text x="60" y="180" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="58" font-weight="900" fill="white">3,000円以下で買える</text>
  <text x="60" y="260" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="58" font-weight="900" fill="#fbbf24">コスパ最強ガジェット</text>
  <text x="60" y="340" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="58" font-weight="900" fill="white">ランキングTOP10</text>

  <!-- Separator line -->
  <rect x="60" y="370" width="500" height="4" rx="2" fill="url(#accent)"/>

  <!-- Description -->
  <text x="60" y="420" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="28" fill="#94a3b8">充電器・USBハブ・ワイヤレス充電など実用アイテムを厳選</text>
  <text x="60" y="460" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="28" fill="#94a3b8">Amazon・楽天リンク付き｜コスパ重視の方に最適</text>

  <!-- Ranking icons -->
  <text x="60" y="555" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="48">🥇🥈🥉</text>

  <!-- Site name -->
  <text x="1140" y="590" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="24" fill="#64748b" text-anchor="end">みさおのガジェットブログ</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
</svg>
