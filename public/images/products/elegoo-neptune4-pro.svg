<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#1e3a8a"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- フレーム -->
  <rect x="110" y="78" width="15" height="205" rx="4" fill="url(#frame)"/>
  <rect x="275" y="78" width="15" height="205" rx="4" fill="url(#frame)"/>
  <rect x="110" y="78" width="180" height="13" rx="4" fill="url(#frame)"/>
  <!-- ベッド（セグメント式強調） -->
  <rect x="118" y="250" width="164" height="10" rx="3" fill="#3730a3"/>
  <!-- ベッドセグメント線 -->
  <line x1="145" y1="250" x2="145" y2="260" stroke="#6366f1" stroke-width="2"/>
  <line x1="172" y1="250" x2="172" y2="260" stroke="#6366f1" stroke-width="2"/>
  <line x1="200" y1="250" x2="200" y2="260" stroke="#6366f1" stroke-width="2"/>
  <line x1="228" y1="250" x2="228" y2="260" stroke="#6366f1" stroke-width="2"/>
  <line x1="255" y1="250" x2="255" y2="260" stroke="#6366f1" stroke-width="2"/>
  <!-- X軸 -->
  <rect x="108" y="148" width="184" height="10" rx="3" fill="#93c5fd"/>
  <!-- ヘッド（直接押出） -->
  <rect x="178" y="136" width="44" height="46" rx="6" fill="#1e293b"/>
  <rect x="190" y="176" width="20" height="18" rx="3" fill="#60a5fa"/>
  <!-- Klipperロゴっぽいもの -->
  <circle cx="270" cy="165" r="18" fill="#1d4ed8"/>
  <text x="270" y="169" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9" font-weight="700">Klipper</text>
  <text x="200" y="103" text-anchor="middle" fill="#1d4ed8" font-family="Arial,sans-serif" font-size="13" font-weight="700">Elegoo</text>
  <text x="200" y="308" text-anchor="middle" fill="#1e293b" font-family="Arial,sans-serif" font-size="18" font-weight="800">Neptune 4 Pro</text>
  <text x="200" y="334" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="13">Klipper 500mm/s 直接押出</text>
</svg>