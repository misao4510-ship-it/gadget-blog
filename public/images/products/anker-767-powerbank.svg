<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="battery" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="80%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Battery body -->
  <rect x="100" y="120" width="200" height="160" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Battery terminal -->
  <rect x="298" y="188" width="12" height="24" rx="4" fill="#374151"/>
  <!-- Battery level bar -->
  <rect x="112" y="132" width="176" height="136" rx="12" fill="#0f172a"/>
  <rect x="118" y="138" width="150" height="124" rx="8" fill="url(#battery)" opacity="0.85"/>
  <!-- 87W text -->
  <text x="200" y="215" font-family="'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="900" fill="white" text-anchor="middle">87W</text>
  <!-- Capacity -->
  <text x="200" y="245" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#dcfce7" text-anchor="middle">26,800mAh</text>
  <!-- Ports -->
  <rect x="128" y="290" width="30" height="10" rx="4" fill="#475569"/>
  <rect x="168" y="290" width="30" height="10" rx="4" fill="#475569"/>
  <rect x="208" y="290" width="20" height="10" rx="3" fill="#475569"/>
  <rect x="238" y="290" width="20" height="10" rx="3" fill="#475569"/>
  <!-- Port labels -->
  <text x="143" y="315" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">USB-C</text>
  <text x="183" y="315" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">USB-C</text>
  <text x="218" y="315" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">USB-A</text>
  <text x="248" y="315" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">USB-A</text>
  <!-- Anker text -->
  <text x="200" y="350" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" fill="#94a3b8" text-anchor="middle">Anker 767</text>
  <text x="200" y="370" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">PowerCore 87W</text>
</svg>
