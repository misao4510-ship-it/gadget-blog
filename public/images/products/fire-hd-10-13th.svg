<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Tablet body -->
  <rect x="90" y="70" width="220" height="270" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Screen -->
  <rect x="100" y="80" width="200" height="240" rx="8" fill="url(#screen)"/>
  <!-- Screen content: video frame -->
  <rect x="115" y="100" width="170" height="100" rx="4" fill="#0f172a" opacity="0.6"/>
  <polygon points="200,130 175,155 225,155" fill="white" opacity="0.8"/>
  <!-- Screen content: text lines -->
  <rect x="115" y="215" width="130" height="8" rx="4" fill="#bfdbfe" opacity="0.7"/>
  <rect x="115" y="230" width="100" height="6" rx="3" fill="#93c5fd" opacity="0.5"/>
  <!-- Amazon logo area -->
  <text x="200" y="300" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">amazon</text>
  <!-- Front camera -->
  <circle cx="200" cy="73" r="4" fill="#0f172a"/>
  <!-- Home button -->
  <circle cx="200" cy="360" r="0" fill="#374151"/>
  <!-- Title -->
  <text x="200" y="355" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle">Fire HD 10</text>
  <text x="200" y="375" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">第13世代 | 10.1インチ FullHD</text>
</svg>
