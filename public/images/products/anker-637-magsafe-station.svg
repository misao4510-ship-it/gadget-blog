<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Base pad -->
  <ellipse cx="200" cy="290" rx="140" ry="30" fill="#1e293b"/>
  <ellipse cx="200" cy="285" rx="135" ry="26" fill="#334155"/>
  <!-- Main charging pad -->
  <ellipse cx="200" cy="220" rx="110" ry="100" fill="#1e293b"/>
  <ellipse cx="200" cy="218" rx="104" ry="94" fill="#0f172a"/>
  <!-- Wireless charging rings -->
  <circle cx="200" cy="218" r="75" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.8"/>
  <circle cx="200" cy="218" r="55" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="218" r="35" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.3"/>
  <!-- Glow effect -->
  <ellipse cx="200" cy="218" rx="80" ry="72" fill="url(#glow)"/>
  <!-- Center dot -->
  <circle cx="200" cy="218" r="12" fill="#06b6d4" opacity="0.9"/>
  <!-- Magnetic ring indicator -->
  <circle cx="200" cy="218" r="22" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 4"/>
  <!-- Cable -->
  <path d="M 200 340 Q 200 370 200 380" stroke="#475569" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Label -->
  <text x="200" y="370" font-family="Arial, sans-serif" font-size="13" fill="#38bdf8" text-anchor="middle">Anker 637 MagGo</text>
</svg>
