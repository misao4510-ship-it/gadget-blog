<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Mouse body -->
  <ellipse cx="200" cy="230" rx="70" ry="100" fill="#374151"/>
  <ellipse cx="200" cy="150" rx="70" ry="50" fill="#4b5563"/>
  <!-- Left/Right button divider -->
  <line x1="200" y1="110" x2="200" y2="180" stroke="#9ca3af" stroke-width="2"/>
  <!-- Scroll wheel -->
  <rect x="185" y="155" width="30" height="20" rx="8" fill="#f59e0b"/>
  <!-- Side button -->
  <rect x="130" y="210" width="20" height="12" rx="4" fill="#3b82f6"/>
  <!-- Brand text -->
  <text x="200" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle">MX MASTER 3S</text>
  <!-- Logo dot -->
  <circle cx="200" cy="245" r="6" fill="#3b82f6"/>
  <!-- Title -->
  <text x="200" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Logicool</text>
  <text x="200" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Wireless Mouse</text>
</svg>
