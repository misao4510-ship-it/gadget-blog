<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- Air purifier body -->
  <rect x="130" y="55" width="140" height="260" rx="16" fill="url(#body)" stroke="#cbd5e0" stroke-width="2"/>
  <!-- Air outlet (top) -->
  <rect x="145" y="62" width="110" height="40" rx="8" fill="#e2e8f0"/>
  <!-- Vent lines -->
  <line x1="155" y1="72" x2="255" y2="72" stroke="#cbd5e0" stroke-width="1"/>
  <line x1="155" y1="80" x2="255" y2="80" stroke="#cbd5e0" stroke-width="1"/>
  <line x1="155" y1="88" x2="255" y2="88" stroke="#cbd5e0" stroke-width="1"/>
  <!-- Display panel -->
  <rect x="160" y="115" width="80" height="35" rx="6" fill="#1a202c"/>
  <text x="200" y="137" text-anchor="middle" fill="#60a5fa" font-family="Arial,sans-serif" font-size="14" font-weight="300">PM2.5: 8</text>
  <!-- Plasmacluster badge -->
  <circle cx="200" cy="175" r="18" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="172" text-anchor="middle" fill="#3b82f6" font-family="Arial,sans-serif" font-size="6" font-weight="700">Plasma</text>
  <text x="200" y="181" text-anchor="middle" fill="#3b82f6" font-family="Arial,sans-serif" font-size="6" font-weight="700">Cluster</text>
  <!-- Air flow arrows -->
  <path d="M175 45 L200 25 L225 45" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <path d="M185 38 L200 18 L215 38" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
  <!-- SHARP logo -->
  <text x="200" y="260" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="14" font-weight="700">SHARP</text>
  <!-- Humidity display -->
  <text x="200" y="230" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">湿度 55%</text>
  <!-- Label -->
  <text x="200" y="340" text-anchor="middle" fill="#2d3748" font-family="Arial,sans-serif" font-size="20" font-weight="800">SHARP KC-S50</text>
  <text x="200" y="368" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="15">加湿空気清浄機</text>
</svg>