<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- Mug body -->
  <rect x="130" y="130" width="160" height="175" rx="12" fill="url(#mug)" stroke="#64748b" stroke-width="2"/>
  <!-- Mug lid -->
  <rect x="124" y="118" width="172" height="16" rx="8" fill="#475569"/>
  <!-- Mug handle -->
  <path d="M290 160 Q340 160 340 205 Q340 250 290 250" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <!-- Highlight on mug -->
  <rect x="145" y="140" width="20" height="140" rx="6" fill="white" opacity="0.25"/>
  <!-- Snow Peak logo triangle -->
  <polygon points="185,220 200,195 215,220" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <!-- TITANIUM text on mug -->
  <text x="200" y="255" text-anchor="middle" fill="#1e293b" font-family="Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="2">TITANIUM</text>
  <!-- Steam lines -->
  <path d="M175 112 Q182 100 175 88" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 106 Q207 94 200 82" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <path d="M225 112 Q232 100 225 88" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <!-- Labels -->
  <text x="200" y="340" text-anchor="middle" fill="#0f172a" font-family="Arial,sans-serif" font-size="20" font-weight="800">Snow Peak</text>
  <text x="200" y="368" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="15">チタンシングルマグ 600</text>
</svg>
