<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fdf2f8"/><stop offset="100%" stop-color="#fce7f3"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1a2e"/><stop offset="100%" stop-color="#16213e"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- Charger body -->
  <rect x="130" y="120" width="140" height="160" rx="20" fill="url(#body)"/>
  <!-- USB-C port -->
  <rect x="162" y="265" width="76" height="20" rx="8" fill="#374151"/>
  <!-- USB-A port -->
  <rect x="162" y="238" width="76" height="20" rx="6" fill="#4b5563"/>
  <!-- GaN badge -->
  <rect x="148" y="140" width="104" height="32" rx="8" fill="#ec4899" opacity="0.8"/>
  <text x="200" y="162" text-anchor="middle" fill="white" font-size="16" font-weight="800">GaN 65W</text>
  <!-- Plug prongs -->
  <rect x="166" y="95" width="16" height="30" rx="4" fill="#9ca3af"/>
  <rect x="218" y="95" width="16" height="30" rx="4" fill="#9ca3af"/>
  <!-- Baseus text -->
  <text x="200" y="200" text-anchor="middle" fill="#f9a8d4" font-size="12" font-weight="700">BASEUS</text>

  <text x="200" y="350" text-anchor="middle" fill="#1a1a2e" font-family="Arial,sans-serif" font-size="16" font-weight="800">GaN Charger 65W</text>
  <text x="200" y="373" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="13">USB-C PD</text>
</svg>