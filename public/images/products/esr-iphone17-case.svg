<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#93c5fd"/><stop offset="50%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- Phone case outline -->
  <rect x="125" y="55" width="150" height="265" rx="28" fill="url(#case)" stroke="#2563eb" stroke-width="2"/>
  <!-- Screen area (darker) -->
  <rect x="135" y="70" width="130" height="235" rx="22" fill="#1e3a5f" opacity=".3"/>
  <!-- Camera module -->
  <rect x="150" y="78" width="70" height="70" rx="16" fill="rgba(0,0,0,.15)" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
  <circle cx="172" cy="100" r="12" fill="rgba(0,0,0,.25)" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
  <circle cx="202" cy="100" r="12" fill="rgba(0,0,0,.25)" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
  <circle cx="172" cy="130" r="12" fill="rgba(0,0,0,.25)" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
  <circle cx="202" cy="130" r="5" fill="rgba(0,0,0,.2)"/>
  <!-- MagSafe ring -->
  <circle cx="200" cy="225" r="28" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
  <circle cx="200" cy="225" r="22" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
  <!-- Side button -->
  <rect x="275" y="150" width="4" height="30" rx="2" fill="#2563eb"/>
  <!-- ESR logo -->
  <text x="200" y="280" text-anchor="middle" fill="rgba(255,255,255,.5)" font-family="Arial,sans-serif" font-size="14" font-weight="700">ESR</text>
  <!-- Label -->
  <text x="200" y="348" text-anchor="middle" fill="#2d3748" font-family="Arial,sans-serif" font-size="18" font-weight="800">ESR iPhone 17 Pro Max</text>
  <text x="200" y="375" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="15">MagSafe フロストブルー</text>
</svg>