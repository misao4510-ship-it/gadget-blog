<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#f3e8ff"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2d3748"/><stop offset="100%" stop-color="#1a202c"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- Hub body -->
  <rect x="90" y="150" width="220" height="100" rx="16" fill="url(#body)"/>
  <!-- Ports left side -->
  <rect x="60" y="173" width="32" height="16" rx="4" fill="#a855f7"/>
  <!-- Ports right side -->
  <rect x="100" y="235" width="20" height="14" rx="3" fill="#6b7280"/>
  <rect x="130" y="235" width="20" height="14" rx="3" fill="#6b7280"/>
  <rect x="160" y="235" width="20" height="14" rx="3" fill="#6b7280"/>
  <!-- LED -->
  <circle cx="290" cy="185" r="5" fill="#a855f7"/>
  <!-- ANKER text -->
  <text x="200" y="195" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">ANKER</text>
  <text x="200" y="212" text-anchor="middle" fill="#a855f7" font-size="11">5-in-1 Hub</text>

  <text x="200" y="350" text-anchor="middle" fill="#2d3748" font-family="Arial,sans-serif" font-size="16" font-weight="800">5-in-1 USB-C Hub</text>
  <text x="200" y="373" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="13">HDMI / USB3.0 / SD</text>
</svg>