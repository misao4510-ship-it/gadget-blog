<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Charger body -->
  <rect x="120" y="100" width="160" height="180" rx="20" fill="#3b82f6"/>
  <rect x="130" y="110" width="140" height="160" rx="16" fill="#1d4ed8"/>
  <!-- USB-C port -->
  <rect x="170" y="255" width="60" height="14" rx="7" fill="#93c5fd"/>
  <!-- LED indicator -->
  <circle cx="200" cy="175" r="20" fill="#06b6d4" opacity="0.9"/>
  <circle cx="200" cy="175" r="12" fill="#cffafe"/>
  <!-- GaN label -->
  <text x="200" y="230" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#93c5fd" text-anchor="middle">65W GaN</text>
  <!-- Prongs -->
  <rect x="165" y="280" width="16" height="36" rx="4" fill="#e2e8f0"/>
  <rect x="219" y="280" width="16" height="36" rx="4" fill="#e2e8f0"/>
  <!-- Label -->
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Anker 735</text>
</svg>
