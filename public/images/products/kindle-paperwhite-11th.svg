<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Kindle body -->
  <rect x="120" y="80" width="160" height="220" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Screen -->
  <rect x="130" y="90" width="140" height="190" rx="6" fill="#f1f5f9"/>
  <!-- Screen text lines -->
  <rect x="142" y="105" width="116" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="142" y="118" width="100" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="142" y="128" width="116" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="142" y="138" width="90" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="142" y="148" width="116" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="142" y="158" width="106" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="142" y="175" width="116" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="142" y="185" width="80" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="142" y="195" width="116" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="142" y="205" width="95" height="4" rx="2" fill="#e2e8f0"/>
  <!-- Kindle logo -->
  <text x="200" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">kindle</text>
  <!-- USB-C port -->
  <rect x="186" y="296" width="28" height="5" rx="2" fill="#475569"/>
  <!-- IPX8 badge -->
  <rect x="150" y="320" width="100" height="26" rx="13" fill="#0e7490" opacity="0.8"/>
  <text x="200" y="338" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#e0f2fe" text-anchor="middle">IPX8 防水</text>
  <!-- Title -->
  <text x="200" y="370" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Paperwhite 第11世代</text>
</svg>
