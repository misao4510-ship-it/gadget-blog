<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#dcfce7"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a202c"/><stop offset="100%" stop-color="#2d3748"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- Battery body -->
  <rect x="100" y="140" width="200" height="110" rx="16" fill="url(#body)"/>
  <!-- Magnetic ring -->
  <circle cx="200" cy="195" r="55" fill="none" stroke="#22c55e" stroke-width="6" opacity="0.8"/>
  <circle cx="200" cy="195" r="35" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.5"/>
  <!-- Wireless icon -->
  <text x="200" y="205" text-anchor="middle" fill="#22c55e" font-size="28">⚡</text>

  <text x="200" y="350" text-anchor="middle" fill="#1a202c" font-family="Arial,sans-serif" font-size="16" font-weight="800">MagGo Battery</text>
  <text x="200" y="373" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="13">5,000mAh</text>
</svg>