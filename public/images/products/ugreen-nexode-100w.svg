<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#052e16"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Charger body (square compact) -->
  <rect x="110" y="100" width="180" height="190" rx="22" fill="#16a34a"/>
  <rect x="120" y="110" width="160" height="170" rx="18" fill="#15803d"/>
  <!-- 100W label -->
  <text x="200" y="175" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#bbf7d0" text-anchor="middle">100W</text>
  <!-- GaN label -->
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#86efac" text-anchor="middle">GaN Nexode</text>
  <!-- Port row -->
  <rect x="145" y="240" width="46" height="12" rx="6" fill="#4ade80"/>
  <rect x="209" y="237" width="46" height="16" rx="4" fill="#166534"/>
  <!-- Prongs -->
  <rect x="163" y="290" width="16" height="38" rx="4" fill="#e2e8f0"/>
  <rect x="221" y="290" width="16" height="38" rx="4" fill="#e2e8f0"/>
  <!-- Label -->
  <text x="200" y="370" font-family="Arial, sans-serif" font-size="15" fill="#86efac" text-anchor="middle">UGREEN</text>
</svg>
