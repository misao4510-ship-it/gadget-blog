<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0f9ff"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- 大型バッテリー本体 -->
  <rect x="110" y="115" width="180" height="130" rx="16" fill="url(#body)" stroke="#334155" stroke-width="2"/>
  <!-- 内蔵ケーブル（引き出し式） -->
  <path d="M290 155 Q320 155 320 180 Q320 210 295 210" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <rect x="290" y="198" width="16" height="10" rx="3" fill="#94a3b8"/>
  <!-- LEDインジケーター -->
  <circle cx="155" cy="215" r="6" fill="#22c55e"/>
  <circle cx="178" cy="215" r="6" fill="#22c55e"/>
  <circle cx="201" cy="215" r="6" fill="#22c55e"/>
  <circle cx="224" cy="215" r="6" fill="#22c55e"/>
  <circle cx="247" cy="215" r="6" fill="#334155" opacity=".4"/>
  <!-- ロゴ -->
  <text x="195" y="155" text-anchor="middle" fill="#63b3ed" font-family="Arial,sans-serif" font-size="16" font-weight="700">ANKER</text>
  <text x="195" y="185" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="14" font-weight="800">25000mAh 165W</text>
  <text x="200" y="295" text-anchor="middle" fill="#1e293b" font-family="Arial,sans-serif" font-size="16" font-weight="800">Anker Power Bank</text>
  <text x="200" y="320" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="13">25000mAh 内蔵ケーブル</text>
</svg>