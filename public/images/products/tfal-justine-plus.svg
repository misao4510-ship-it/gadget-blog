<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="kettle" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- Kettle body -->
  <path d="M140 130 Q135 130 130 150 L120 250 Q118 270 140 275 L260 275 Q282 270 280 250 L270 150 Q265 130 260 130 Z" fill="url(#kettle)" stroke="#cbd5e0" stroke-width="2"/>
