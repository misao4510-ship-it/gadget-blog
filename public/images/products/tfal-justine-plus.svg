  <path d="M195 95 Q193 78 200 68" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity=".4"/>
  <path d="M220 100 Q218 85 225 75" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity=".4"/>
  <!-- Label -->
  <text x="200" y="330" text-anchor="middle" fill="#2d3748" font-family="Arial,sans-serif" font-size="20" font-weight="800">T-fal ジャスティンプラス</text>
  <text x="200" y="358" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="16">1.2L 電気ケトル</text>
