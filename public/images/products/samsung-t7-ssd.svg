<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#dcfce7"/></linearGradient>
    <linearGradient id="ssd" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3182ce"/><stop offset="100%" stop-color="#2b6cb0"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- SSD body (rounded rectangle, tilted slightly) -->
  <rect x="120" y="100" width="160" height="200" rx="24" fill="url(#ssd)" stroke="#2c5282" stroke-width="2"/>
  <!-- Samsung logo area -->
  <text x="200" y="165" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="20" font-weight="700" opacity=".9">SAMSUNG</text>
  <!-- T7 -->
  <text x="200" y="210" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="300">T7</text>
  <!-- Capacity -->
  <text x="200" y="245" text-anchor="middle" fill="#bee3f8" font-family="Arial,sans-serif" font-size="14">1TB</text>
  <!-- USB-C port at bottom -->
  <rect x="188" y="290" width="24" height="10" rx="5" fill="#2c5282" stroke="#1a365d" stroke-width="1"/>
  <!-- LED indicator -->
  <rect x="190" y="270" width="20" height="3" rx="1.5" fill="#48bb78" opacity=".8"/>
  <!-- Label -->
  <text x="200" y="340" text-anchor="middle" fill="#2d3748" font-family="Arial,sans-serif" font-size="22" font-weight="800">Samsung T7 SSD</text>
  <text x="200" y="368" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="16">1TB USB-C ポータブル</text>
</svg>