<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ecfdf5"/><stop offset="100%" stop-color="#d1fae5"/></linearGradient>
    <linearGradient id="charger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f7fafc"/><stop offset="100%" stop-color="#edf2f7"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- Charger body -->
  <rect x="135" y="100" width="130" height="170" rx="16" fill="url(#charger)" stroke="#cbd5e0" stroke-width="2"/>
  <!-- USB-C port 1 -->
  <rect x="165" y="130" width="70" height="18" rx="5" fill="#2d3748"/>
  <text x="200" y="144" text-anchor="middle" fill="#a0aec0" font-family="Arial,sans-serif" font-size="8" font-weight="700">USB-C 45W</text>
  <!-- USB-C port 2 -->
  <rect x="165" y="160" width="70" height="18" rx="5" fill="#2d3748"/>
  <text x="200" y="174" text-anchor="middle" fill="#a0aec0" font-family="Arial,sans-serif" font-size="8" font-weight="700">USB-C 20W</text>
  <!-- USB-A port -->
  <rect x="165" y="190" width="70" height="18" rx="5" fill="#2d3748"/>
  <text x="200" y="204" text-anchor="middle" fill="#a0aec0" font-family="Arial,sans-serif" font-size="8" font-weight="700">USB-A</text>
  <!-- Prongs -->
  <rect x="170" y="270" width="12" height="35" rx="2" fill="#a0aec0"/>
  <rect x="218" y="270" width="12" height="35" rx="2" fill="#a0aec0"/>
  <!-- GaN badge -->
  <circle cx="200" cy="240" r="14" fill="#38a169" opacity=".9"/>
  <text x="200" y="244" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="9" font-weight="800">GaN</text>
  <!-- Label -->
  <text x="200" y="340" text-anchor="middle" fill="#2d3748" font-family="Arial,sans-serif" font-size="22" font-weight="800">CIO NovaPort TRIO</text>
  <text x="200" y="368" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="16">65W 3ポート GaN充電器</text>
</svg>