<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Stand base -->
  <rect x="155" y="310" width="90" height="15" rx="6" fill="#374151"/>
  <rect x="170" y="295" width="60" height="18" rx="4" fill="#2d3748"/>
  <!-- Main stand arm -->
  <rect x="188" y="200" width="24" height="100" rx="6" fill="#374151"/>
  <!-- iPhone pad (MagSafe) -->
  <rect x="135" y="130" width="130" height="78" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <!-- MagSafe ring -->
  <circle cx="200" cy="169" r="30" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8,4"/>
  <circle cx="200" cy="169" r="12" fill="#1e40af"/>
  <!-- Bolt icon -->
  <text x="200" y="176" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#93c5fd" text-anchor="middle">⚡</text>
  <!-- Apple Watch pad -->
  <ellipse cx="310" cy="200" rx="28" ry="16" fill="#1e293b" stroke="#4b5563" stroke-width="2"/>
  <circle cx="310" cy="200" r="10" fill="#1e40af" opacity="0.7"/>
  <!-- AirPods pad -->
  <ellipse cx="130" cy="240" rx="30" ry="18" fill="#1e293b" stroke="#4b5563" stroke-width="2"/>
  <circle cx="130" cy="240" r="8" fill="#374151"/>
  <!-- 3-in-1 badge -->
  <rect x="145" y="330" width="110" height="26" rx="13" fill="#1e40af"/>
  <text x="200" y="348" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#bfdbfe" text-anchor="middle">3-in-1 MagSafe</text>
  <!-- Brand -->
  <text x="200" y="378" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Belkin Boost Charge Pro</text>
</svg>
