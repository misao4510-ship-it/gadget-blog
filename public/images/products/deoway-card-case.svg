<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#374151"/><stop offset="100%" stop-color="#1f2937"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- 名刺入れ本体（V字開き） -->
  <path d="M140 170 L200 230 L260 170" fill="none" stroke="url(#case)" stroke-width="0"/>
  <!-- 左半分 -->
  <polygon points="130,160 200,230 130,270" fill="url(#case)" rx="4"/>
  <!-- 右半分 -->
  <polygon points="270,160 200,230 270,270" fill="url(#case)"/>
  <!-- ステンレス枠 -->
  <line x1="130" y1="160" x2="270" y2="160" stroke="#6b7280" stroke-width="4"/>
  <line x1="130" y1="270" x2="270" y2="270" stroke="#6b7280" stroke-width="4"/>
  <!-- マグネット点 -->
  <circle cx="200" cy="235" r="8" fill="#9ca3af"/>
  <!-- 名刺イメージ -->
  <rect x="150" y="165" width="60" height="38" rx="2" fill="white" opacity=".8"/>
  <rect x="215" y="165" width="48" height="38" rx="2" fill="white" opacity=".6"/>
  <text x="200" y="315" text-anchor="middle" fill="#1f2937" font-family="Arial,sans-serif" font-size="17" font-weight="800">deoway 名刺入れ</text>
  <text x="200" y="340" text-anchor="middle" fill="#6b7280" font-family="Arial,sans-serif" font-size="13">マグネット式 70枚収納</text>
</svg>