<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0f9ff"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2d3748"/><stop offset="100%" stop-color="#1a202c"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- Battery body -->
  <rect x="100" y="120" width="200" height="120" rx="16" fill="url(#body)" stroke="#4a5568" stroke-width="2"/>
  <!-- USB port -->
  <rect x="280" y="165" width="20" height="30" rx="4" fill="#4a5568"/>
  <!-- LED indicators -->
  <circle cx="150" cy="220" r="5" fill="#48bb78"/><circle cx="175" cy="220" r="5" fill="#48bb78"/>
  <circle cx="200" cy="220" r="5" fill="#48bb78"/><circle cx="225" cy="220" r="5" fill="#4a5568" opacity=".3"/>
  <!-- Anker logo area -->
  <text x="190" y="175" text-anchor="middle" fill="#63b3ed" font-family="Arial,sans-serif" font-size="18" font-weight="700">ANKER</text>
  <!-- Capacity label -->
  <text x="200" y="300" text-anchor="middle" fill="#2d3748" font-family="Arial,sans-serif" font-size="22" font-weight="800">PowerCore 10000</text>
  <text x="200" y="330" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="16">10,000mAh</text>
</svg>