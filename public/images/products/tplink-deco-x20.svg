<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Unit 1 -->
  <ellipse cx="145" cy="220" rx="55" ry="80" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <ellipse cx="145" cy="180" rx="52" ry="30" fill="#243548"/>
  <!-- LED ring unit 1 -->
  <circle cx="145" cy="200" r="18" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.7"/>
  <circle cx="145" cy="200" r="8" fill="#15803d"/>
  <!-- Unit 2 -->
  <ellipse cx="255" cy="220" rx="55" ry="80" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <ellipse cx="255" cy="180" rx="52" ry="30" fill="#243548"/>
  <!-- LED ring unit 2 -->
  <circle cx="255" cy="200" r="18" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.7"/>
  <circle cx="255" cy="200" r="8" fill="#15803d"/>
  <!-- Wireless signal between -->
  <path d="M190 175 Q200 165 210 175" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.8"/>
  <path d="M183 165 Q200 148 217 165" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.6"/>
  <!-- Wi-Fi 6 badge -->
  <rect x="158" y="308" width="84" height="26" rx="13" fill="#1d4ed8"/>
  <text x="200" y="326" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#bfdbfe" text-anchor="middle">Wi-Fi 6</text>
  <!-- Title -->
  <text x="200" y="355" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">TP-Link Deco X20</text>
  <text x="200" y="375" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">メッシュWi-Fi 2台セット</text>
</svg>
