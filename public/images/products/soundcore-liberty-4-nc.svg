<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Case body -->
  <rect x="105" y="130" width="190" height="160" rx="30" fill="#1e293b"/>
  <rect x="113" y="138" width="174" height="144" rx="24" fill="#0f172a"/>
  <!-- Left earbud slot -->
  <ellipse cx="160" cy="210" rx="30" ry="38" fill="#1e293b"/>
  <ellipse cx="160" cy="208" rx="24" ry="30" fill="#312e81"/>
  <!-- Left earbud -->
  <ellipse cx="160" cy="200" rx="16" ry="20" fill="#4f46e5"/>
  <circle cx="160" cy="195" r="7" fill="#818cf8"/>
  <!-- Right earbud slot -->
  <ellipse cx="240" cy="210" rx="30" ry="38" fill="#1e293b"/>
  <ellipse cx="240" cy="208" rx="24" ry="30" fill="#312e81"/>
  <!-- Right earbud -->
  <ellipse cx="240" cy="200" rx="16" ry="20" fill="#4f46e5"/>
  <circle cx="240" cy="195" r="7" fill="#818cf8"/>
  <!-- Charging indicator LED -->
  <circle cx="200" cy="260" r="6" fill="#22c55e"/>
  <!-- Hinge line -->
  <line x1="113" y1="210" x2="287" y2="210" stroke="#1e293b" stroke-width="3"/>
  <!-- ANC badge -->
  <rect x="162" y="305" width="76" height="26" rx="13" fill="#4f46e5"/>
  <text x="200" y="323" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e0e7ff" text-anchor="middle">Liberty 4 NC</text>
  <!-- Label -->
  <text x="200" y="365" font-family="Arial, sans-serif" font-size="14" fill="#818cf8" text-anchor="middle">Soundcore</text>
</svg>
