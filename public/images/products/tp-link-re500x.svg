<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f0a1e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Router body -->
  <rect x="130" y="160" width="140" height="120" rx="12" fill="#312e81"/>
  <rect x="138" y="168" width="124" height="104" rx="8" fill="#1e1b4b"/>
  <!-- WiFi signal arcs -->
  <path d="M 160 130 Q 200 90 240 130" stroke="#818cf8" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 145 115 Q 200 68 255 115" stroke="#6366f1" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 130 100 Q 200 46 270 100" stroke="#4338ca" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Center dot -->
  <circle cx="200" cy="148" r="8" fill="#a5b4fc"/>
  <!-- LED indicators -->
  <circle cx="160" cy="195" r="6" fill="#4ade80"/>
  <circle cx="180" cy="195" r="6" fill="#4ade80" opacity="0.7"/>
  <circle cx="200" cy="195" r="6" fill="#60a5fa"/>
  <circle cx="220" cy="195" r="6" fill="#60a5fa" opacity="0.5"/>
  <!-- AX1500 label -->
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#a5b4fc" text-anchor="middle">AX1500</text>
  <!-- Prongs -->
  <rect x="163" y="280" width="16" height="42" rx="4" fill="#e2e8f0"/>
  <rect x="221" y="280" width="16" height="42" rx="4" fill="#e2e8f0"/>
  <!-- Label -->
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="15" fill="#818cf8" text-anchor="middle">TP-Link RE500X</text>
</svg>
