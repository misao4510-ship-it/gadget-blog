<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff7ed"/><stop offset="100%" stop-color="#ffedd5"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1c3a5c"/><stop offset="100%" stop-color="#0f2035"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- Hub body -->
  <rect x="80" y="155" width="240" height="90" rx="14" fill="url(#body)"/>
  <!-- USB ports -->
  <rect x="100" y="235" width="18" height="14" rx="3" fill="#f97316"/>
  <rect x="128" y="235" width="18" height="14" rx="3" fill="#f97316"/>
  <rect x="156" y="235" width="18" height="14" rx="3" fill="#f97316"/>
  <rect x="184" y="235" width="18" height="14" rx="3" fill="#f97316"/>
  <!-- UGREEN text -->
  <text x="200" y="192" text-anchor="middle" fill="#fb923c" font-size="16" font-weight="800">UGREEN</text>
  <!-- LED row -->
  <circle cx="130" cy="210" r="4" fill="#f97316"/>
  <circle cx="155" cy="210" r="4" fill="#f97316"/>
  <circle cx="180" cy="210" r="4" fill="#f97316"/>
  <circle cx="205" cy="210" r="4" fill="#4a5568" opacity=".4"/>

  <text x="200" y="350" text-anchor="middle" fill="#1c3a5c" font-family="Arial,sans-serif" font-size="16" font-weight="800">USB3.0 Hub</text>
  <text x="200" y="373" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="13">4-Port</text>
</svg>