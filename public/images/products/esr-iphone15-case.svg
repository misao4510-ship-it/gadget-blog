<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- Phone case -->
  <rect x="130" y="100" width="140" height="220" rx="24" fill="url(#body)" opacity="0.85"/>
  <!-- Case inner cutout -->
  <rect x="140" y="110" width="120" height="200" rx="18" fill="#e2e8f0" opacity="0.7"/>
  <!-- Magnetic ring -->
  <circle cx="200" cy="195" r="52" fill="none" stroke="#64748b" stroke-width="5"/>
  <circle cx="200" cy="195" r="38" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- Camera bump -->
  <rect x="148" y="118" width="50" height="50" rx="12" fill="#334155" opacity="0.6"/>
  <!-- ESR text -->
  <text x="200" y="267" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="700">ESR</text>

  <text x="200" y="350" text-anchor="middle" fill="#334155" font-family="Arial,sans-serif" font-size="16" font-weight="800">HaloLock Case</text>
  <text x="200" y="373" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="13">MagSafe対応</text>
</svg>