<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fdf2f8"/><stop offset="100%" stop-color="#fce7f3"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a202c"/><stop offset="100%" stop-color="#2d3748"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- Band top -->
  <rect x="165" y="50" width="70" height="70" rx="8" fill="#e2e8f0"/>
  <!-- Watch body -->
  <rect x="150" y="110" width="100" height="130" rx="22" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
  <!-- Screen -->
  <rect x="160" y="120" width="80" height="110" rx="16" fill="url(#screen)"/>
  <!-- Watch face - time -->
  <text x="200" y="170" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="28" font-weight="300">10:09</text>
  <!-- Activity rings -->
  <circle cx="185" cy="200" r="10" fill="none" stroke="#f56565" stroke-width="3" stroke-dasharray="50 63" stroke-dashoffset="0"/>
  <circle cx="200" cy="200" r="10" fill="none" stroke="#48bb78" stroke-width="3" stroke-dasharray="45 63" stroke-dashoffset="0"/>
  <circle cx="215" cy="200" r="10" fill="none" stroke="#4299e1" stroke-width="3" stroke-dasharray="40 63" stroke-dashoffset="0"/>
  <!-- Crown -->
  <rect x="250" y="155" width="8" height="20" rx="4" fill="#a0aec0"/>
  <!-- Band bottom -->
  <rect x="165" y="240" width="70" height="70" rx="8" fill="#e2e8f0"/>
  <!-- Label -->
  <text x="200" y="340" text-anchor="middle" fill="#2d3748" font-family="Arial,sans-serif" font-size="22" font-weight="800">Apple Watch SE</text>
  <text x="200" y="368" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="16">第2世代 40mm</text>
</svg>