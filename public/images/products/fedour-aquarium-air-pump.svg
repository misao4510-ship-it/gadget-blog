<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="pump" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#1e3a8a"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- ポンプ本体 -->
  <rect x="130" y="140" width="140" height="90" rx="12" fill="url(#pump)"/>
  <!-- ダイヤル -->
  <circle cx="165" cy="185" r="22" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/>
  <circle cx="165" cy="185" r="8" fill="#60a5fa"/>
  <!-- ロゴ部分 -->
  <text x="220" y="178" text-anchor="middle" fill="#bfdbfe" font-family="Arial,sans-serif" font-size="12" font-weight="700">FEDOUR</text>
  <text x="220" y="198" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11">10W 4口</text>
  <!-- エアチューブ4本 -->
  <line x1="145" y1="230" x2="145" y2="265" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <line x1="165" y1="230" x2="165" y2="265" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <line x1="225" y1="230" x2="225" y2="265" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <line x1="245" y1="230" x2="245" y2="265" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <!-- 泡 -->
  <circle cx="150" cy="275" r="5" fill="#93c5fd" opacity=".7"/>
  <circle cx="168" cy="272" r="4" fill="#93c5fd" opacity=".5"/>
  <circle cx="228" cy="276" r="5" fill="#93c5fd" opacity=".7"/>
  <text x="200" y="310" text-anchor="middle" fill="#1e3a8a" font-family="Arial,sans-serif" font-size="16" font-weight="800">FEDOUR エアーポンプ</text>
  <text x="200" y="335" text-anchor="middle" fill="#1d4ed8" font-family="Arial,sans-serif" font-size="13">10W 4吐出口 超静音</text>
</svg>