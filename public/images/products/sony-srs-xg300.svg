<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Speaker body -->
  <rect x="80" y="140" width="240" height="130" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Speaker grille dots -->
  <circle cx="130" cy="195" r="4" fill="#374151"/>
  <circle cx="150" cy="185" r="4" fill="#374151"/>
  <circle cx="150" cy="205" r="4" fill="#374151"/>
  <circle cx="170" cy="195" r="4" fill="#374151"/>
  <circle cx="170" cy="175" r="4" fill="#374151"/>
  <circle cx="170" cy="215" r="4" fill="#374151"/>
  <!-- Main woofer -->
  <circle cx="240" cy="200" r="45" fill="#0f172a" stroke="#374151" stroke-width="3"/>
  <circle cx="240" cy="200" r="30" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="240" cy="200" r="12" fill="#374151"/>
  <!-- Control buttons -->
  <circle cx="110" cy="215" r="10" fill="#3b82f6"/>
  <text x="110" y="220" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">▶</text>
  <rect x="310" y="210" width="18" height="6" rx="3" fill="#f59e0b"/>
  <!-- Handle -->
  <rect x="130" y="120" width="140" height="22" rx="11" fill="#374151" stroke="#4b5563" stroke-width="2"/>
  <!-- IP67 badge -->
  <rect x="290" y="145" width="50" height="22" rx="4" fill="#065f46"/>
  <text x="315" y="161" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">IP67</text>
  <!-- SONY text -->
  <text x="200" y="298" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#94a3b8" text-anchor="middle">SONY</text>
  <text x="200" y="320" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">SRS-XG300</text>
  <text x="200" y="345" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">30時間再生 | IP67防水</text>
</svg>
