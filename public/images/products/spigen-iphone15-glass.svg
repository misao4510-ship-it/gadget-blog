<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0f9ff"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#172554"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- Phone outline -->
  <rect x="140" y="110" width="120" height="200" rx="20" fill="none" stroke="#1e3a5f" stroke-width="6"/>
  <!-- Glass layer -->
  <rect x="148" y="118" width="104" height="184" rx="14" fill="#bfdbfe" opacity="0.4"/>
  <!-- Camera cutout -->
  <circle cx="200" cy="133" r="10" fill="#172554"/>
  <!-- Guide frame (EZ Fit) -->
  <rect x="125" y="96" width="150" height="228" rx="8" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- 2 pack label -->
  <rect x="155" y="290" width="90" height="26" rx="13" fill="#38bdf8"/>
  <text x="200" y="308" text-anchor="middle" fill="white" font-size="13" font-weight="700">2枚セット</text>

  <text x="200" y="350" text-anchor="middle" fill="#1e3a5f" font-family="Arial,sans-serif" font-size="16" font-weight="800">EZ Fit Glass</text>
  <text x="200" y="373" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="13">iPhone 15 Pro × 2</text>
</svg>