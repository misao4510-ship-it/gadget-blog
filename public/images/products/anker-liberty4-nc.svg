<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Charging case -->
  <rect x="120" y="180" width="160" height="110" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Case LED -->
  <circle cx="200" cy="283" r="5" fill="#22c55e"/>
  <!-- Left earbud -->
  <ellipse cx="148" cy="150" rx="28" ry="35" fill="#374151" stroke="#4b5563" stroke-width="2"/>
  <circle cx="148" cy="145" r="10" fill="#1e293b"/>
  <circle cx="148" cy="145" r="5" fill="#3b82f6"/>
  <!-- Left earbud stem -->
  <rect x="143" y="178" width="10" height="18" rx="5" fill="#4b5563"/>
  <!-- Right earbud -->
  <ellipse cx="252" cy="150" rx="28" ry="35" fill="#374151" stroke="#4b5563" stroke-width="2"/>
  <circle cx="252" cy="145" r="10" fill="#1e293b"/>
  <circle cx="252" cy="145" r="5" fill="#3b82f6"/>
  <!-- Right earbud stem -->
  <rect x="247" y="178" width="10" height="18" rx="5" fill="#4b5563"/>
  <!-- ANC badge -->
  <rect x="145" y="220" width="110" height="28" rx="14" fill="#7c3aed" opacity="0.8"/>
  <text x="200" y="239" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#ddd6fe" text-anchor="middle">ANC 98.5%</text>
  <!-- Title -->
  <text x="200" y="328" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#94a3b8" text-anchor="middle">Anker Soundcore</text>
  <text x="200" y="348" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Liberty 4 NC</text>
  <text x="200" y="368" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">LDAC | 50時間再生</text>
</svg>
