<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="battery" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="75%" style="stop-color:#16a34a"/>
      <stop offset="75%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Power bank body -->
  <rect x="100" y="130" width="200" height="140" rx="20" fill="#1e293b"/>
  <rect x="108" y="138" width="184" height="124" rx="16" fill="#0f172a"/>
  <!-- Battery level indicator -->
  <rect x="118" y="170" width="164" height="60" rx="8" fill="#0f172a"/>
  <rect x="122" y="174" width="114" height="52" rx="6" fill="url(#battery)"/>
  <!-- Battery tip -->
  <rect x="286" y="180" width="10" height="40" rx="4" fill="#334155"/>
  <!-- Percentage -->
  <text x="200" y="208" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">75%</text>
  <!-- USB-C port -->
  <rect x="145" y="258" width="50" height="10" rx="5" fill="#3b82f6"/>
  <!-- USB-A port -->
  <rect x="205" y="255" width="50" height="14" rx="3" fill="#64748b"/>
  <!-- Label -->
  <text x="200" y="310" font-family="Arial, sans-serif" font-size="13" fill="#3b82f6" text-anchor="middle">PowerCore 10000 PD</text>
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Anker</text>
</svg>
