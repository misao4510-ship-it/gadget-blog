  <rect width="1200" height="8" fill="#FF9900"/>
  <!-- Accent bar bottom -->
  <rect y="622" width="1200" height="8" fill="#FF9900"/>

  <!-- Card case icon decoration -->
  <rect x="60" y="100" width="160" height="110" rx="10" fill="none" stroke="#FF9900" stroke-width="4" opacity="0.3"/>
