  <!-- Main title -->
  <text x="260" y="192" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="38" fill="#ffffff" font-weight="bold">deoway 名刺入れ</text>
  <text x="260" y="246" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="36" fill="#ffffff" font-weight="bold">マグネット式 V字型</text>
  <text x="260" y="300" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="34" fill="#FF9900" font-weight="bold">2026年最新型 レビュー</text>

  <!-- Key points -->
  <rect x="260" y="338" width="660" height="2" fill="#FF9900" opacity="0.5"/>

  <text x="260" y="380" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="28" fill="#cccccc">✓ 70枚以上収納の大容量設計</text>
  <text x="260" y="424" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="28" fill="#cccccc">✓ マグネット式でピタッと開閉</text>
  <text x="260" y="468" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="28" fill="#cccccc">✓ Amazon★4.3 メンズ9位</text>

