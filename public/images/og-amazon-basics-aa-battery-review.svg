<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>
  <!-- Accent bar top -->
  <rect width="1200" height="8" fill="#FF9900"/>
  <!-- Accent bar bottom -->
  <rect y="622" width="1200" height="8" fill="#FF9900"/>

  <!-- Battery icon decoration -->
  <rect x="60" y="80" width="160" height="320" rx="12" fill="none" stroke="#FF9900" stroke-width="4" opacity="0.3"/>
  <rect x="100" y="62" width="80" height="24" rx="6" fill="#FF9900" opacity="0.3"/>
  <!-- Battery fill bars -->
  <rect x="72" y="308" width="136" height="80" rx="4" fill="#FF9900" opacity="0.5"/>
  <rect x="72" y="220" width="136" height="80" rx="4" fill="#FF9900" opacity="0.4"/>
  <rect x="72" y="132" width="136" height="80" rx="4" fill="#FF9900" opacity="0.3"/>

  <!-- Category badge -->
  <rect x="260" y="88" width="200" height="40" rx="20" fill="#FF9900"/>
  <text x="360" y="114" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="18" fill="#1a1a2e" font-weight="bold" text-anchor="middle">アルカリ電池レビュー</text>

  <!-- Main title -->
  <text x="260" y="192" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="38" fill="#ffffff" font-weight="bold">Amazonベーシック</text>
  <text x="260" y="246" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="38" fill="#ffffff" font-weight="bold">単3形アルカリ電池</text>
  <text x="260" y="300" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="36" fill="#FF9900" font-weight="bold">20本セット レビュー</text>

  <!-- Key points -->
  <rect x="260" y="338" width="660" height="2" fill="#FF9900" opacity="0.5"/>

  <text x="260" y="380" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="28" fill="#cccccc">✓ 1本あたり約38円のコスパ最強</text>
  <text x="260" y="424" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="28" fill="#cccccc">✓ 保存期限10年・防災備蓄にも最適</text>
  <text x="260" y="468" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="28" fill="#cccccc">✓ Amazon★4.3 レビュー87万件超</text>

  <!-- Price badge -->
  <rect x="260" y="510" width="240" height="72" rx="8" fill="#FF9900"/>
  <text x="380" y="540" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="16" fill="#1a1a2e" font-weight="bold" text-anchor="middle">20本セット</text>
  <text x="380" y="570" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="28" fill="#1a1a2e" font-weight="bold" text-anchor="middle">¥758〜</text>

  <!-- Site name -->
  <text x="1140" y="600" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="18" fill="#888888" text-anchor="end">misao-gadget.blog</text>
